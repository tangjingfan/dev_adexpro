gbplanner:
  ros__parameters:
    plan_period_sec: 1.5
    waypoint_advance_radius: 1.5
    world_frame_id: map

    SensorParams:
      sensor_list: [VLP16]
      VLP16:
        type: kLidar
        max_range: 15.0
        min_range: 0.3
        fov: [6.2832, 0.5236]
        resolution: [0.01795, 0.0349]
        center_offset: [0.0, 0.0, 0.3]
        rotations: [0.0, 0.0, 0.0]
        frame_id: sensor
        frontier_percentage_threshold: 0.008

    RobotParams:
      type: kGroundRobot
      size: [0.6, 0.6, 0.75]
      size_extension_min: [0.05, 0.05, 0.05]
      size_extension: [0.1, 0.1, 0.1]
      center_offset: [0.0, 0.0, 0.0]
      safety_extension: [0.3, 0.3, 0.3]
      relax_ratio: 0.5
      bound_mode: kExtendedBound

    BoundedSpaceParams:
      Global:
        type: kCuboid
        min_val: [-100.0, -100.0, -2.0]
        max_val: [100.0, 100.0, 4.0]
        min_extension: [-5.0, -5.0, 0.0]
        max_extension: [5.0, 5.0, 0.0]
        rotations: [0.0, 0.0, 0.0]
      Local:
        type: kCuboid
        min_val: [-10.0, -10.0, -0.1]
        max_val: [10.0, 10.0, 0.1]
        min_extension: [0.0, 0.0, 0.0]
        max_extension: [0.0, 0.0, 0.0]
        rotations: [0.0, 0.0, 0.0]
      LocalSearch:
        type: kCuboid
        min_val: [-15.0, -15.0, -1.0]
        max_val: [15.0, 15.0, 2.0]
        rotations: [0.0, 0.0, 0.0]
      LocalAdaptiveExp:
        type: kCuboid
        min_val: [-6.0, -6.0, -1.0]
        max_val: [6.0, 6.0, 2.0]
        rotations: [0.0, 0.0, 0.0]

    PlanningParams:
      type: kBasicExploration
      rr_mode: kGraph
      exp_sensor_list: [VLP16]
      v_max: 0.6
      v_homing_max: 0.6
      yaw_rate_max: 0.8
      yaw_tangent_correction: true
      exp_gain_voxel_size: 0.8
      use_ray_model_for_volumetric_gain: true
      free_voxel_gain: 0.0
      occupied_voxel_gain: 0.0
      unknown_voxel_gain: 10.0
      edge_length_min: 0.5
      edge_length_max: 2.0
      num_vertices_max: 500.0
      num_edges_max: 5000.0
      edge_overshoot: 0.2
      num_loops_cutoff: 2000.0
      num_loops_max: 10000.0
      nearest_range: 2.0
      nearest_range_min: 1.0
      nearest_range_max: 3.0
      use_current_state: true
      path_length_penalty: 0.05
      path_direction_penalty: 1.0
      hanging_vertex_penalty: 5.0
      traverse_length_max: 5.0
      traverse_time_max: 10.0
      augment_free_voxels_time: 100.0
      free_frustum_before_planning: false
      auto_homing_enable: false
      geofence_checking_enable: false
      time_budget_limit: 7200.0
      homing_backward: false
      planning_backward: false
      path_safety_enhance_enable: true
      global_frame_id: map
      freespace_cloud_enable: false
      leafs_only_for_volumetric_gain: true
      max_ground_height: 0.75
      robot_height: 0.75
      max_inclination: 0.52
      cluster_vertices_for_gain: true
      clustering_radius: 1.5
      path_interpolation_distance: 0.4
      auto_global_planner_enable: true
      relaxed_corridor_multiplier: 1.0
      interpolate_projection_distance: true
      go_home_if_fully_explored: false
      ray_cast_step_size_multiplier: 2.0
      nonuniform_ray_cast: true

    RandomSamplerParams:
      SamplerForExploration:
        X: {pdf_type: kUniform, sample_mode: kLocal, min_val: -10.0, max_val: 10.0}
        Y: {pdf_type: kUniform, sample_mode: kLocal, min_val: -10.0, max_val: 10.0}
        Z: {pdf_type: kUniform, sample_mode: kLocal, min_val: -0.05, max_val: 0.05}
        Heading: {pdf_type: kUniform, sample_mode: kLocal, min_val: -3.1416, max_val: 3.1416}
      SamplerForSearching:
        X: {pdf_type: kUniform, sample_mode: kGlobal, min_val: -100.0, max_val: 100.0}
        Y: {pdf_type: kUniform, sample_mode: kGlobal, min_val: -100.0, max_val: 100.0}
        Z: {pdf_type: kUniform, sample_mode: kGlobal, min_val: -1.0, max_val: 2.0}
        Heading: {pdf_type: kUniform, sample_mode: kGlobal, min_val: -3.1416, max_val: 3.1416}
      SamplerForAdaptiveExp:
        X: {pdf_type: kUniform, sample_mode: kLocal, min_val: -6.0, max_val: 6.0}
        Y: {pdf_type: kUniform, sample_mode: kLocal, min_val: -6.0, max_val: 6.0}
        Z: {pdf_type: kUniform, sample_mode: kLocal, min_val: -0.2, max_val: 0.2}
        Heading: {pdf_type: kUniform, sample_mode: kLocal, min_val: -3.1416, max_val: 3.1416}

    RobotDynamics:
      v_max: 0.6
      v_homing_max: 0.6
      yaw_rate_max: 0.8

    tsdf_voxel_size: 0.25
    tsdf_voxels_per_side: 16
    voxel_carving_enabled: true
    color_mode: color
    use_tf_transforms: true
    world_frame: map
    publish_tsdf_map: true
    publish_pointclouds: true
    update_mesh_every_n_sec: 0.5
    max_ray_length_m: 15.0
    min_ray_length_m: 0.5
    truncation_distance: 0.4
